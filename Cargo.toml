[package]
name = "start-chat-gpt"
version = "1.2.3"
edition = "2024"
build = "build.rs"
license = "MIT"
repository = "https://github.com/wenxingyu/startChatGPT"
description = "A lightweight Windows launcher for ChatGPT/Codex with configurable proxy support"

[package.metadata.winresource]
FileDescription = "startChatGPT - ChatGPT 代理启动器"
ProductName = "startChatGPT"
OriginalFilename = "startChatGPT.exe"
InternalName = "startChatGPT"
CompanyName = "WenXingyu"
LegalCopyright = "Copyright © 2026 WenXingyu"

[[bin]]
name = "startChatGPT"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false

[build-dependencies]
winresource = "0.1.31"

[dependencies]
serde_json = "1.0.151"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }
