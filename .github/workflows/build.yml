name: Compare Defender detections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare existing binaries without executing them
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35226617381 --repo $env:GITHUB_REPOSITORY --name defender-source-comparison --dir diagnostics/controlled
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download comparison artifacts' }
          gh release download v1.2.6 --repo $env:GITHUB_REPOSITORY --pattern startChatGPT.exe --dir diagnostics/published
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download published control' }
          ./diagnostics/compare-pe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: defender-pe-comparison
          path: diagnostics/pe-output/
          if-no-files-found: error
