name: Compare Defender detections

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: Build controlled source comparisons
        shell: pwsh
        run: ./diagnostics/compare-builds.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: defender-source-comparison
          path: diagnostics/output/
          if-no-files-found: error
